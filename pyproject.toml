[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ray", email = "wangchangrui1815@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bm25>=0.3.11",
    "fonttools>=4.66.0",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pymupdf4llm>=1.28.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
rag = "rag:main"

[build-system]
